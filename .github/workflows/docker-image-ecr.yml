name: Docker Image CI - ECR Candidate (Build Only)

on:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    docker:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v6.0.2
              with:
                  fetch-depth: 0
            - uses: pnpm/action-setup@v4
              with:
                  version: 10.26.0
            - uses: actions/setup-node@v6
              with:
                  node-version: '24.18.0'
                  cache: 'pnpm'
                  cache-dependency-path: pnpm-lock.yaml
            - name: Verify source and release contracts
              run: |
                  before="$(sha256sum pnpm-lock.yaml | awk '{print $1}')"
                  pnpm install --frozen-lockfile
                  after="$(sha256sum pnpm-lock.yaml | awk '{print $1}')"
                  test "$before" = "$after"
                  pnpm test:release
                  bash scripts/verify-release-source.sh
                  bash scripts/verify-security.sh
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4.0.0
            - name: Resolve immutable build metadata
              id: metadata
              run: |
                  echo "source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" >> "$GITHUB_OUTPUT"
                  echo "revision=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
                  echo "version=git-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
                  echo "created=$(git show -s --format=%cI "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"
            - name: Build ECR candidate without registry side effects
              uses: docker/build-push-action@v6.19.2
              with:
                  context: .
                  file: Dockerfile
                  platforms: linux/amd64
                  push: false
                  tags: flowise-ecr-candidate:${{ steps.metadata.outputs.version }}
                  build-args: |
                      BUILD_SOURCE=${{ steps.metadata.outputs.source }}
                      BUILD_REVISION=${{ steps.metadata.outputs.revision }}
                      BUILD_VERSION=${{ steps.metadata.outputs.version }}
                      BUILD_CREATED=${{ steps.metadata.outputs.created }}
