name: Node CI
on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - '*'
    workflow_dispatch:
permissions:
    contents: read
jobs:
    build:
        strategy:
            matrix:
                platform: [ubuntu-latest]
                node-version: [24.18.0]
        runs-on: ${{ matrix.platform }}
        env:
            PUPPETEER_SKIP_DOWNLOAD: true
        steps:
            - uses: actions/checkout@v6
            - uses: pnpm/action-setup@v4
              with:
                  version: 10.26.0
            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v6
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: 'pnpm'
                  cache-dependency-path: 'pnpm-lock.yaml'
            - name: Frozen install without lockfile drift
              run: |
                  before="$(sha256sum pnpm-lock.yaml | awk '{print $1}')"
                  pnpm install --frozen-lockfile
                  after="$(sha256sum pnpm-lock.yaml | awk '{print $1}')"
                  test "$before" = "$after"
            - name: Verify release contracts
              run: |
                  pnpm test:release
                  bash scripts/verify-release-source.sh
                  bash scripts/verify-security.sh
            - run: pnpm lint
            - run: pnpm build
              env:
                  NODE_OPTIONS: '--max_old_space_size=4096'
            - name: Validate complete localized component metadata against the fresh build
              run: pnpm metadata:i18n:validate:built
            - name: Run coverage serially within hosted-runner memory limits
              run: pnpm exec turbo run test:coverage --concurrency=1 -- --runInBand
              env:
                  NODE_OPTIONS: '--max_old_space_size=6144'
            - name: Enforce the G1 Chinese copy gate
              run: pnpm --filter flowise-ui test:g1-copy
            - name: Cypress install
              run: pnpm cypress install
            - name: Cypress test
              working-directory: packages/server
              run: pnpm cypress:ci
