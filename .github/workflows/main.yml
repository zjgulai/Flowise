name: Node CI
on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - '*'
    workflow_dispatch:
permissions:
    contents: read
jobs:
    build:
        strategy:
            matrix:
                platform: [ubuntu-latest]
                node-version: [24.18.0]
        runs-on: ${{ matrix.platform }}
        env:
            PUPPETEER_SKIP_DOWNLOAD: true
        steps:
            - uses: actions/checkout@v6
            - uses: pnpm/action-setup@v4
              with:
                  version: 10.26.0
            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v6
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: 'pnpm'
                  cache-dependency-path: 'pnpm-lock.yaml'
            - name: Frozen install without lockfile drift
              run: |
                  before="$(sha256sum pnpm-lock.yaml | awk '{print $1}')"
                  pnpm install --frozen-lockfile
                  after="$(sha256sum pnpm-lock.yaml | awk '{print $1}')"
                  test "$before" = "$after"
            - name: Verify release contracts
              run: |
                  pnpm test:release
                  bash scripts/verify-release-source.sh
                  bash scripts/verify-security.sh
            - run: pnpm lint
            - run: pnpm build
              env:
                  NODE_OPTIONS: '--max_old_space_size=4096'
            - name: Run coverage serially within hosted-runner memory limits
              run: pnpm exec turbo run test:coverage --concurrency=1 -- --runInBand
            - name: Cypress install
              run: pnpm cypress install
            - name: Install dependencies (Cypress Action)
              uses: cypress-io/github-action@v7.1.5
              with:
                  working-directory: ./
                  runTests: false
            - name: Cypress test
              uses: cypress-io/github-action@v7.1.5
              env:
                  APP_URL: http://127.0.0.1:3000
                  CORS_ORIGINS: http://127.0.0.1:3000
                  DATABASE_PATH: ${{ runner.temp }}/flowise-e2e
                  DATABASE_TYPE: sqlite
                  DISABLE_FLOWISE_TELEMETRY: 'true'
                  FLOWISE_E2E_ARTIFACTS_PATH: ${{ runner.temp }}/flowise-cypress-artifacts
                  FLOWISE_E2E_BASE_URL: http://127.0.0.1:3000
                  FLOWISE_E2E_ISOLATED: '1'
                  FLOWISE_E2E_RUN_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}
                  MODE: main
                  OFFLINE: 'true'
                  POSTHOG_PUBLIC_API_KEY: ''
                  SECRETKEY_PATH: ${{ runner.temp }}/flowise-e2e
              with:
                  install: false
                  working-directory: packages/server
                  start: pnpm start
                  wait-on: 'http://localhost:3000'
                  wait-on-timeout: 120
                  browser: chrome
