name: Node CI
on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - '*'
    workflow_dispatch:
permissions:
    contents: read
jobs:
    build:
        strategy:
            matrix:
                platform: [ubuntu-latest]
                node-version: [24.18.0]
        runs-on: ${{ matrix.platform }}
        env:
            FLOWISE_CI_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
            FLOWISE_CI_EVENT_SHA: ${{ github.sha }}
            PUPPETEER_SKIP_DOWNLOAD: true
        steps:
            - uses: actions/checkout@v6
            - name: Verify CI source identity
              run: |
                  actual="$(git rev-parse HEAD)"
                  [[ "$FLOWISE_CI_CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
                  [[ "$FLOWISE_CI_EVENT_SHA" =~ ^[0-9a-f]{40}$ ]]
                  test "$actual" = "$FLOWISE_CI_EVENT_SHA"
                  printf '[flowise-ci] phase=source-identity event=%s candidate=%s checkout=%s\n' \
                      "$FLOWISE_CI_EVENT_SHA" "$FLOWISE_CI_CANDIDATE_SHA" "$actual"
            - uses: pnpm/action-setup@v4
              with:
                  version: 10.26.0
            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v6
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: 'pnpm'
                  cache-dependency-path: 'pnpm-lock.yaml'
            - name: Frozen install without lockfile drift
              run: |
                  before="$(sha256sum pnpm-lock.yaml | awk '{print $1}')"
                  pnpm install --frozen-lockfile
                  after="$(sha256sum pnpm-lock.yaml | awk '{print $1}')"
                  test "$before" = "$after"
            - name: Verify release contracts
              run: |
                  pnpm test:release
                  bash scripts/verify-release-source.sh
                  bash scripts/verify-security.sh
            - name: Verify readiness evidence contracts
              run: node --test scripts/contracts/monitor-contracts.test.mjs scripts/contracts/csp-observation.test.mjs
            - name: Enforce the full-tree UI copy ratchet
              run: pnpm ui:copy:check
            - run: pnpm lint
            - run: pnpm build
              env:
                  NODE_OPTIONS: '--max_old_space_size=4096'
            - name: Validate complete localized component metadata against the fresh build
              run: pnpm metadata:i18n:validate:built
            - name: Run coverage serially within hosted-runner memory limits
              run: pnpm exec turbo run test:coverage --concurrency=1 -- --runInBand
              env:
                  NODE_OPTIONS: '--max_old_space_size=6144'
            - name: Enforce the G1 Chinese copy gate
              run: pnpm --filter flowise-ui test:g1-copy
            - name: Cypress install
              run: pnpm cypress install
            - name: Cypress test
              working-directory: packages/server
              run: pnpm cypress:ci
    exact-head:
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        env:
            FLOWISE_CI_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
            FLOWISE_CI_EVENT_SHA: ${{ github.sha }}
            PUPPETEER_SKIP_DOWNLOAD: true
        steps:
            - uses: actions/checkout@v6
              with:
                  ref: ${{ env.FLOWISE_CI_CANDIDATE_SHA }}
            - name: Verify CI source identity
              run: |
                  actual="$(git rev-parse HEAD)"
                  [[ "$FLOWISE_CI_CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
                  [[ "$FLOWISE_CI_EVENT_SHA" =~ ^[0-9a-f]{40}$ ]]
                  test "$actual" = "$FLOWISE_CI_CANDIDATE_SHA"
                  printf '[flowise-ci] phase=source-identity event=%s candidate=%s checkout=%s\n' \
                      "$FLOWISE_CI_EVENT_SHA" "$FLOWISE_CI_CANDIDATE_SHA" "$actual"
            - uses: pnpm/action-setup@v4
              with:
                  version: 10.26.0
            - name: Use Node.js 24.18.0
              uses: actions/setup-node@v6
              with:
                  node-version: 24.18.0
                  cache: 'pnpm'
                  cache-dependency-path: 'pnpm-lock.yaml'
            - name: Frozen install without lockfile drift
              run: |
                  before="$(sha256sum pnpm-lock.yaml | awk '{print $1}')"
                  pnpm install --frozen-lockfile
                  after="$(sha256sum pnpm-lock.yaml | awk '{print $1}')"
                  test "$before" = "$after"
            - name: Verify release contracts
              run: |
                  pnpm test:release
                  bash scripts/verify-release-source.sh
                  bash scripts/verify-security.sh
            - name: Verify readiness evidence contracts
              run: node --test scripts/contracts/monitor-contracts.test.mjs scripts/contracts/csp-observation.test.mjs
            - name: Enforce the full-tree UI copy ratchet
              run: pnpm ui:copy:check
            - run: pnpm lint
            - run: pnpm build
              env:
                  NODE_OPTIONS: '--max_old_space_size=4096'
            - name: Validate complete localized component metadata against the fresh build
              run: pnpm metadata:i18n:validate:built
            - name: Run coverage serially within hosted-runner memory limits
              run: pnpm exec turbo run test:coverage --concurrency=1 -- --runInBand
              env:
                  NODE_OPTIONS: '--max_old_space_size=6144'
            - name: Enforce the G1 Chinese copy gate
              run: pnpm --filter flowise-ui test:g1-copy
            - name: Cypress install
              run: pnpm cypress install
            - name: Cypress test
              working-directory: packages/server
              run: pnpm cypress:ci
