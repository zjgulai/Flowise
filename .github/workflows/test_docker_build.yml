name: Test Fork Release Docker Build

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - '*'
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: flowise-release-build-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-24.04
        timeout-minutes: 120
        env:
            CANDIDATE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
            CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
            ARTIFACT_NAME: flowise-release-git-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-linux-amd64
            IMAGE_TAG: flowise-chinese:git-${{ github.event.pull_request.head.sha || github.sha }}
            PUPPETEER_SKIP_DOWNLOAD: true
            SMOKE_NAME: flowise-ci-smoke-${{ github.run_id }}-${{ github.run_attempt }}
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  fetch-depth: 0
                  persist-credentials: false
                  repository: ${{ env.CANDIDATE_REPOSITORY }}
                  ref: ${{ env.CANDIDATE_SHA }}
            - name: Verify release automation is tracked by Git
              run: |
                  set -euo pipefail
                  test "$(uname -m)" = x86_64
                  test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
                  git ls-files --error-unmatch -- \
                      .github/workflows/docker-image-dockerhub.yml \
                      .github/workflows/production-readonly-monitor.yml \
                      .github/workflows/test_docker_build.yml \
                      Dockerfile \
                      docker/apk-build.lock \
                      docker/apk-runtime.lock \
                      docker/seccomp/chromium.json \
                      scripts/deployment-bundle.mjs \
                      scripts/deployment-bundle.test.mjs \
                      scripts/flowise-production-release.py \
                      scripts/metadata-i18n/extract.mjs \
                      scripts/metadata-i18n/fingerprint.mjs \
                      scripts/metadata-i18n/fingerprint.test.mjs \
                      scripts/metadata-i18n/validate.mjs \
                      scripts/metadata-i18n/write-build-fingerprint.mjs \
                      scripts/release-manifest.mjs \
                      scripts/release-manifest.test.mjs \
                      scripts/test_flowise_production_release.py \
                      scripts/verify-chromium-sandbox.sh \
                      scripts/verify-release-candidate.sh \
                      scripts/verify-security.sh >/dev/null
            - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
              with:
                  version: 10.26.0
            - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
              with:
                  node-version: '24.18.0'
                  cache: 'pnpm'
                  cache-dependency-path: pnpm-lock.yaml
            - name: Verify source and release contracts
              run: |
                  set -euo pipefail
                  before="$(sha256sum pnpm-lock.yaml | awk '{print $1}')"
                  pnpm install --frozen-lockfile
                  after="$(sha256sum pnpm-lock.yaml | awk '{print $1}')"
                  test "$before" = "$after"
                  pnpm audit --prod --audit-level high
                  pnpm test:release
                  pnpm metadata:i18n:validate
                  bash scripts/verify-release-source.sh
                  bash scripts/verify-security.sh
                  test -z "$(git status --porcelain --untracked-files=all)"
                  git clean -dffqx
                  test -z "$(git status --porcelain --untracked-files=all)"
                  test -z "$(git clean -ndffx)"
            - name: Set up the pinned Docker Buildx and BuildKit toolchain
              uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
              with:
                  version: v0.34.1
                  driver: docker-container
                  driver-opts: image=moby/buildkit:v0.30.0@sha256:0168606be2315b7c807a03b3d8aa79beefdb31c98740cebdffdfeebf31190c9f
            - name: Resolve immutable build metadata
              id: metadata
              run: |
                  set -euo pipefail
                  test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
                  echo "source=${GITHUB_SERVER_URL}/${CANDIDATE_REPOSITORY}" >> "$GITHUB_OUTPUT"
                  echo "revision=${CANDIDATE_SHA}" >> "$GITHUB_OUTPUT"
                  echo "version=git-${CANDIDATE_SHA}" >> "$GITHUB_OUTPUT"
                  echo "created=$(git show -s --format=%cI "$CANDIDATE_SHA")" >> "$GITHUB_OUTPUT"
                  echo "source_date_epoch=$(git show -s --format=%ct "$CANDIDATE_SHA")" >> "$GITHUB_OUTPUT"
            - name: Build root Dockerfile without pushing
              uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
              env:
                  SOURCE_DATE_EPOCH: ${{ steps.metadata.outputs.source_date_epoch }}
              with:
                  context: .
                  file: Dockerfile
                  platforms: linux/amd64
                  outputs: type=docker,name=flowise-chinese:${{ steps.metadata.outputs.version }},rewrite-timestamp=true
                  push: false
                  provenance: false
                  tags: flowise-chinese:${{ steps.metadata.outputs.version }}
                  build-args: |
                      SOURCE_DATE_EPOCH=${{ steps.metadata.outputs.source_date_epoch }}
                      BUILD_SOURCE=${{ steps.metadata.outputs.source }}
                      BUILD_REVISION=${{ steps.metadata.outputs.revision }}
                      BUILD_VERSION=${{ steps.metadata.outputs.version }}
                      BUILD_CREATED=${{ steps.metadata.outputs.created }}
            - name: Verify canonical offline artifact and isolated runtime
              env:
                  BUNDLE_DIR: ${{ runner.temp }}/flowise-release-git-${{ github.event.pull_request.head.sha || github.sha }}-linux-amd64
                  ARCHIVE_PATH: ${{ runner.temp }}/flowise-release-git-${{ github.event.pull_request.head.sha || github.sha }}-linux-amd64/image.tar.gz
                  EVIDENCE_PATH: ${{ runner.temp }}/flowise-release-git-${{ github.event.pull_request.head.sha || github.sha }}-linux-amd64/evidence.txt
                  MANIFEST_PATH: ${{ runner.temp }}/flowise-release-git-${{ github.event.pull_request.head.sha || github.sha }}-linux-amd64/release-manifest.json
              run: |
                  install -d -m 0700 "$BUNDLE_DIR"
                  bash scripts/verify-release-candidate.sh \
                      --image-tag "$IMAGE_TAG" \
                      --source "${{ steps.metadata.outputs.source }}" \
                      --revision "${{ steps.metadata.outputs.revision }}" \
                      --version "${{ steps.metadata.outputs.version }}" \
                      --created "${{ steps.metadata.outputs.created }}" \
                      --archive "$ARCHIVE_PATH" \
                      --manifest "$MANIFEST_PATH" \
                      --evidence "$EVIDENCE_PATH" \
                      --smoke-name "$SMOKE_NAME"
            - name: Upload short-lived offline release artifact
              if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              env:
                  BUNDLE_DIR: ${{ runner.temp }}/flowise-release-git-${{ github.event.pull_request.head.sha || github.sha }}-linux-amd64
              with:
                  name: ${{ env.ARTIFACT_NAME }}
                  path: ${{ env.BUNDLE_DIR }}
                  if-no-files-found: error
                  retention-days: 3
                  compression-level: 0

    release_readiness:
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        needs: build
        runs-on: ubuntu-24.04
        timeout-minutes: 120
        permissions:
            contents: read
        environment:
            name: release-readiness
        env:
            ARTIFACT_NAME: flowise-release-git-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-linux-amd64
            REBUILD_TAG: flowise-chinese:git-${{ github.sha }}
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
              with:
                  version: 10.26.0
            - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
              with:
                  node-version: '24.18.0'
            - name: Set up the pinned Docker Buildx and BuildKit toolchain
              uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
              with:
                  version: v0.34.1
                  driver: docker-container
                  driver-opts: image=moby/buildkit:v0.30.0@sha256:0168606be2315b7c807a03b3d8aa79beefdb31c98740cebdffdfeebf31190c9f
            - name: Download the same-run offline release artifact
              uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
              with:
                  name: ${{ env.ARTIFACT_NAME }}
                  path: ${{ runner.temp }}/flowise-release
            - name: Independently rebuild and bind the candidate config identity
              env:
                  INDEPENDENT_ARCHIVE_PATH: ${{ runner.temp }}/flowise-release-readiness-independent.tar.gz
              run: |
                  set -euo pipefail
                  test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
                  test -z "$(git status --porcelain --untracked-files=all)"
                  test -z "$(git clean -ndffx)"
                  expected_source="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
                  expected_version="git-${GITHUB_SHA}"
                  expected_created="$(git show -s --format=%cI "$GITHUB_SHA")"
                  source_date_epoch="$(git show -s --format=%ct "$GITHUB_SHA")"
                  cleanup_independent_rebuild() {
                      docker image rm "$REBUILD_TAG" >/dev/null 2>&1 || true
                      rm -f -- "$INDEPENDENT_ARCHIVE_PATH"
                  }
                  trap cleanup_independent_rebuild EXIT
                  SOURCE_DATE_EPOCH="$source_date_epoch" docker buildx build \
                      --file Dockerfile \
                      --platform linux/amd64 \
                      --output "type=docker,name=$REBUILD_TAG,rewrite-timestamp=true" \
                      --provenance=false \
                      --tag "$REBUILD_TAG" \
                      --build-arg "SOURCE_DATE_EPOCH=$source_date_epoch" \
                      --build-arg "BUILD_SOURCE=$expected_source" \
                      --build-arg "BUILD_REVISION=$GITHUB_SHA" \
                      --build-arg "BUILD_VERSION=$expected_version" \
                      --build-arg "BUILD_CREATED=$expected_created" \
                      .
                  docker save "$REBUILD_TAG" | gzip -n > "$INDEPENDENT_ARCHIVE_PATH"
                  independent_config_digest="$(node scripts/release-manifest.mjs verify-archive \
                      --archive "$INDEPENDENT_ARCHIVE_PATH" \
                      --image-tag "$REBUILD_TAG" \
                      --revision "$GITHUB_SHA" \
                      --source "$expected_source" \
                      --version "$expected_version" \
                      --created "$expected_created" \
                      --platform linux/amd64)"
                  expected_config_digest="$(jq -er '.image.config_digest | select(type == "string" and test("^sha256:[0-9a-f]{64}$"))' \
                      "${RUNNER_TEMP}/flowise-release/release-manifest.json")"
                  if [ "$independent_config_digest" != "$expected_config_digest" ]; then
                      printf 'release_readiness_config_mismatch expected=%s actual=%s\n' \
                          "$expected_config_digest" "$independent_config_digest"
                  fi
                  test "$independent_config_digest" = "$expected_config_digest"
                  cleanup_independent_rebuild
                  trap - EXIT
            - name: Verify the approved source and artifact remain exact
              env:
                  BUNDLE_DIR: ${{ runner.temp }}/flowise-release
                  ARCHIVE_PATH: ${{ runner.temp }}/flowise-release/image.tar.gz
                  MANIFEST_PATH: ${{ runner.temp }}/flowise-release/release-manifest.json
              run: |
                  set -euo pipefail
                  test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
                  test -s "$ARCHIVE_PATH"
                  test -s "$MANIFEST_PATH"
                  test -s "$BUNDLE_DIR/deployment-bundle.json"
                  expected_tag="flowise-chinese:git-${GITHUB_SHA}"
                  expected_source="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
                  expected_version="git-${GITHUB_SHA}"
                  expected_created="$(git show -s --format=%cI "$GITHUB_SHA")"
                  config_digest="$(node scripts/release-manifest.mjs verify-archive \
                      --archive "$ARCHIVE_PATH" \
                      --image-tag "$expected_tag" \
                      --revision "$GITHUB_SHA" \
                      --source "$expected_source" \
                      --version "$expected_version" \
                      --created "$expected_created" \
                      --platform linux/amd64)"
                  node scripts/release-manifest.mjs verify \
                      --manifest "$MANIFEST_PATH" \
                      --image-tag "$expected_tag" \
                      --image-config-digest "$config_digest" \
                      --archive "$ARCHIVE_PATH" \
                      --require-clean
                  node scripts/deployment-bundle.mjs verify \
                      --bundle-dir "$BUNDLE_DIR" \
                      --expected-revision "$GITHUB_SHA" \
                      --expected-image-tag "$expected_tag" \
                      --expected-image-config-digest "$config_digest"
                  cleanup_loaded_image() {
                      docker image rm "$expected_tag" >/dev/null 2>&1 || true
                  }
                  trap cleanup_loaded_image EXIT
                  docker image load --input "$ARCHIVE_PATH" >/dev/null
                  test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$expected_tag")" = 'linux/amd64'
                  test "$(docker image inspect --format '{{.Config.User}}' "$expected_tag")" = 'node'
                  test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.source"}}' "$expected_tag")" = "$expected_source"
                  test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$expected_tag")" = "$GITHUB_SHA"
                  test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.version"}}' "$expected_tag")" = "$expected_version"
                  test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.created"}}' "$expected_tag")" = "$expected_created"
                  docker image rm "$expected_tag" >/dev/null
                  trap - EXIT
